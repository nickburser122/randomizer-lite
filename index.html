<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randomizer</title>
<meta name="description" content="Random numbers, list picks, dice, coins, passwords, colors and QR codes.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="tc">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1ede6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15121b">
<link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232a2433'/%3E%3Ccircle cx='10' cy='22' r='3' fill='%23f3e6c4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f3e6c4'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23eb9a80'/%3E%3C/svg%3E">
<link rel="preload" as="font" type="font/woff2" href="fonts/fraunces-latin-opsz-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/fraunces-latin-opsz-italic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/dm-mono-latin-400-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/dm-mono-latin-500-normal.woff2" crossorigin>
<script>try{var t=localStorage.getItem('rz:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="side">
    <h1 class="brand">Randomizer</h1>
    <nav class="nav" id="nav" aria-label="Tools">
      <button type="button" data-tool="number">Number</button>
      <button type="button" data-tool="list">List</button>
      <button type="button" data-tool="dice">Dice</button>
      <button type="button" data-tool="coin">Coin</button>
      <button type="button" data-tool="password">Password</button>
      <button type="button" data-tool="color">Color</button>
      <button type="button" data-tool="qr">QR</button>
    </nav>
    <button type="button" class="theme" id="theme"></button>
  </header>

  <main class="stage">
    <div class="row"><span id="label"></span><span id="note"></span></div>
    <div class="out" id="out" aria-live="polite"></div>
    <div class="row">
      <span class="hint"><kbd>Space</kbd></span>
      <div class="actions">
        <button type="button" class="btn ghost" id="copy">Copy</button>
        <button type="button" class="btn ghost" id="toqr">As QR</button>
        <button type="button" class="btn ghost" id="png" hidden>Save PNG</button>
        <button type="button" class="btn" id="go">Generate</button>
      </div>
    </div>
  </main>

  <aside class="panel">
    <form id="controls" autocomplete="off">
      <fieldset data-panel="number">
        <label class="f"><span>From</span><input id="nMin" type="number" value="1"></label>
        <label class="f"><span>To</span><input id="nMax" type="number" value="100"></label>
        <label class="f w"><span>How many</span><input id="nCount" type="number" inputmode="numeric" min="1" max="1000" value="1"></label>
        <label class="t"><input id="nUniq" type="checkbox"><i></i>No repeats</label>
        <label class="t"><input id="nSort" type="checkbox"><i></i>Sorted</label>
      </fieldset>

      <fieldset data-panel="list" hidden>
        <label class="f w"><span>Items</span><textarea id="lItems" placeholder="One per line" spellcheck="false"></textarea></label>
        <div class="seg" role="radiogroup" aria-label="Mode">
          <label><input type="radio" name="lMode" id="lPick" value="pick" checked><span>Pick</span></label>
          <label><input type="radio" name="lMode" id="lShuffle" value="shuffle"><span>Shuffle</span></label>
          <label><input type="radio" name="lMode" id="lSplit" value="groups"><span>Groups</span></label>
        </div>
        <label class="f w" id="lCountF"><span>How many</span><input id="lCount" type="number" inputmode="numeric" min="1" max="1000" value="1"></label>
        <label class="f w" id="lGroupsF"><span>Number of groups</span><input id="lGroups" type="number" inputmode="numeric" min="1" max="100" value="2"></label>
        <label class="t w" id="lRemoveF"><input id="lRemove" type="checkbox"><i></i>Remove picked from list</label>
      </fieldset>

      <fieldset data-panel="dice" hidden>
        <span class="legend w">Sides</span>
        <div class="seg" role="radiogroup" aria-label="Sides">
          <label><input type="radio" name="dSides" id="d4" value="4"><span>d4</span></label>
          <label><input type="radio" name="dSides" id="d6" value="6" checked><span>d6</span></label>
          <label><input type="radio" name="dSides" id="d8" value="8"><span>d8</span></label>
          <label><input type="radio" name="dSides" id="d10" value="10"><span>d10</span></label>
          <label><input type="radio" name="dSides" id="d12" value="12"><span>d12</span></label>
          <label><input type="radio" name="dSides" id="d20" value="20"><span>d20</span></label>
          <label><input type="radio" name="dSides" id="d100" value="100"><span>d100</span></label>
        </div>
        <label class="f w"><span>Dice</span><input id="dCount" type="number" inputmode="numeric" min="1" max="100" value="1"></label>
      </fieldset>

      <fieldset data-panel="coin" hidden>
        <label class="f w"><span>Flips</span><input id="cCount" type="number" inputmode="numeric" min="1" max="500" value="1"></label>
      </fieldset>

      <fieldset data-panel="password" hidden>
        <label class="f w"><span>Length <output id="pLenOut"></output></span><input id="pLen" type="range" min="4" max="64" value="20"></label>
        <label class="t"><input id="pLower" type="checkbox" checked><i></i>a–z</label>
        <label class="t"><input id="pUpper" type="checkbox" checked><i></i>A–Z</label>
        <label class="t"><input id="pDigits" type="checkbox" checked><i></i>0–9</label>
        <label class="t"><input id="pSymbols" type="checkbox"><i></i>Symbols</label>
        <label class="t w"><input id="pClear" type="checkbox"><i></i>Skip look-alike characters</label>
      </fieldset>

      <fieldset data-panel="color" hidden>
        <span class="legend w">Range</span>
        <div class="seg" role="radiogroup" aria-label="Range">
          <label><input type="radio" name="kMood" id="kAny" value="any" checked><span>Any</span></label>
          <label><input type="radio" name="kMood" id="kVivid" value="vivid"><span>Vivid</span></label>
          <label><input type="radio" name="kMood" id="kPastel" value="pastel"><span>Pastel</span></label>
          <label><input type="radio" name="kMood" id="kDeep" value="deep"><span>Deep</span></label>
        </div>
        <label class="f w"><span>Colors</span><input id="kCount" type="number" inputmode="numeric" min="1" max="8" value="1"></label>
      </fieldset>

      <fieldset data-panel="qr" hidden>
        <label class="f w"><span>Text</span><textarea id="qText" placeholder="Text to encode" spellcheck="false"></textarea></label>
        <span class="legend w">Error correction</span>
        <div class="seg" role="radiogroup" aria-label="Error correction">
          <label><input type="radio" name="qLevel" id="qL" value="L"><span>Low</span></label>
          <label><input type="radio" name="qLevel" id="qM" value="M" checked><span>Medium</span></label>
          <label><input type="radio" name="qLevel" id="qQ" value="Q"><span>High</span></label>
          <label><input type="radio" name="qLevel" id="qH" value="H"><span>Max</span></label>
        </div>
      </fieldset>
    </form>

    <section class="history" id="histWrap" hidden>
      <div class="legend"><span>History</span><button type="button" id="clear">Clear</button></div>
      <ol id="hist"></ol>
    </section>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="js/vendor/qrcode.js"></script>
<script src="js/app.js"></script>
<script>
(() => {
  const r = document.documentElement, b = document.getElementById('theme'), o = ['auto', 'light', 'dark'], k = 'rz:theme', m = document.getElementById('tc');
  let t = r.dataset.theme || 'auto';
  const set = () => {
    if (t === 'auto') delete r.dataset.theme; else r.dataset.theme = t;
    b.dataset.mode = t;
    b.setAttribute('aria-label', 'Theme: ' + t);
    if (t === 'auto') m.removeAttribute('content'); else m.content = t === 'dark' ? '#15121b' : '#f1ede6';
  };
  set();
  b.addEventListener('click', () => {
    t = o[(o.indexOf(t) + 1) % 3];
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(set); else set();
    try { if (t === 'auto') localStorage.removeItem(k); else localStorage.setItem(k, t); } catch (e) {}
    b.blur();
  });
})();
</script>
</body>
</html>
